<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="'Fira Code','Consolas','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <radialGradient id="wallGlow" cx="50%" cy="35%" r="60%">
    <stop offset="0" stop-color="#5b21b6" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#2e1065" stop-opacity=".35"/>
    <stop offset="1" stop-color="#0b0814" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="screenIdle" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b0764"/><stop offset=".55" stop-color="#6d28d9"/><stop offset="1" stop-color="#c026d3"/>
  </linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a2138"/><stop offset="1" stop-color="#151021"/>
  </linearGradient>
  <linearGradient id="kb" x1="0" x2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#c026d3"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/>
  </radialGradient>
  <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="400"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="blurBig" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="400"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="screenClip"><rect x="470" y="113" width="260" height="147" rx="3"/></clipPath>
</defs>
<style>
  .cam{transform-origin:0 0;animation:cam 16s ease-in-out infinite}
  @keyframes cam{0%,12%{transform:translate(0px,0px) scale(1)}35%,88%{transform:translate(-780.0px,-230.09999999999997px) scale(2.3)}100%{transform:translate(0px,0px) scale(1)}}
  .led{animation:led 3s ease-in-out infinite alternate}
  @keyframes led{from{opacity:.55}to{opacity:1}}
  .idle{animation:idle 16s ease-in-out infinite}
  @keyframes idle{0%,30%{opacity:1}36%,88%{opacity:0}94%,100%{opacity:1}}
  .term{animation:term 16s ease-in-out infinite;opacity:0}
  @keyframes term{0%,31%{opacity:0}36%,88%{opacity:1}92%,100%{opacity:0}}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .star{animation:tw 2.4s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.2}to{opacity:1}}
  .fan{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes l0{0%,37%{opacity:0;transform:translateX(-4px)}40%,86%{opacity:1;transform:translateX(0)}89%,100%{opacity:0}}
.l0{animation:l0 16s ease-out infinite;opacity:0}@keyframes l1{0%,41%{opacity:0;transform:translateX(-4px)}44%,86%{opacity:1;transform:translateX(0)}89%,100%{opacity:0}}
.l1{animation:l1 16s ease-out infinite;opacity:0}@keyframes l2{0%,45%{opacity:0;transform:translateX(-4px)}48%,86%{opacity:1;transform:translateX(0)}89%,100%{opacity:0}}
.l2{animation:l2 16s ease-out infinite;opacity:0}@keyframes l3{0%,49%{opacity:0;transform:translateX(-4px)}52%,86%{opacity:1;transform:translateX(0)}89%,100%{opacity:0}}
.l3{animation:l3 16s ease-out infinite;opacity:0}@keyframes l4{0%,53%{opacity:0;transform:translateX(-4px)}56%,86%{opacity:1;transform:translateX(0)}89%,100%{opacity:0}}
.l4{animation:l4 16s ease-out infinite;opacity:0}@keyframes l5{0%,57%{opacity:0;transform:translateX(-4px)}60%,86%{opacity:1;transform:translateX(0)}89%,100%{opacity:0}}
.l5{animation:l5 16s ease-out infinite;opacity:0}@keyframes l6{0%,61%{opacity:0;transform:translateX(-4px)}64%,86%{opacity:1;transform:translateX(0)}89%,100%{opacity:0}}
.l6{animation:l6 16s ease-out infinite;opacity:0}
</style>

<rect width="1200" height="400" fill="#0b0814"/>
<g class="cam">
  <!-- parede e brilho roxo -->
  <rect width="1200" height="400" fill="#0b0814"/>
  <rect class="led" width="1200" height="400" fill="url(#wallGlow)"/>

  <!-- fita de LED no teto -->
  <line class="led" x1="60" y1="22" x2="1140" y2="22" stroke="#a855f7" stroke-width="16" filter="url(#blur)"/>
  <line x1="60" y1="22" x2="1140" y2="22" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round"/>

  <!-- janela com céu noturno -->
  <rect x="88" y="68" width="174" height="154" rx="4" fill="#1a1426"/>
  <rect x="96" y="76" width="158" height="138" fill="#0a0f2c"/>
  <circle cx="225" cy="105" r="13" fill="#f5f3ff"/><circle cx="231" cy="100" r="12" fill="#0a0f2c"/>
  <circle class="star" style="animation-delay:0.00s" cx="110" cy="95" r="0.9" fill="#fff"/><circle class="star" style="animation-delay:0.37s" cx="140" cy="85" r="1.3" fill="#fff"/><circle class="star" style="animation-delay:0.74s" cx="175" cy="110" r="0.9" fill="#fff"/><circle class="star" style="animation-delay:1.11s" cx="205" cy="90" r="1.3" fill="#fff"/><circle class="star" style="animation-delay:1.48s" cx="235" cy="120" r="0.9" fill="#fff"/><circle class="star" style="animation-delay:1.85s" cx="125" cy="140" r="1.3" fill="#fff"/><circle class="star" style="animation-delay:2.22s" cx="190" cy="150" r="0.9" fill="#fff"/><circle class="star" style="animation-delay:2.59s" cx="245" cy="80" r="1.3" fill="#fff"/><circle class="star" style="animation-delay:2.96s" cx="160" cy="175" r="0.9" fill="#fff"/>
  <rect x="173" y="76" width="4" height="138" fill="#1a1426"/><rect x="96" y="143" width="158" height="4" fill="#1a1426"/>

  <!-- prateleira -->
  <rect x="905" y="128" width="190" height="6" rx="2" fill="#2a2138"/>
  <rect x="920" y="92" width="12" height="36" fill="#7c3aed"/><rect x="934" y="98" width="10" height="30" fill="#4c1d95"/>
  <rect x="946" y="88" width="13" height="40" fill="#a855f7"/><rect x="961" y="100" width="9" height="28" fill="#6d28d9"/>
  <path d="M1040 128 l-10 -22 h28 z" fill="#3f2a56"/><circle cx="1044" cy="96" r="12" fill="#22c55e" opacity=".75"/>
  <circle cx="1034" cy="88" r="9" fill="#16a34a" opacity=".75"/><circle cx="1054" cy="90" r="8" fill="#15803d" opacity=".75"/>
  <line class="led" x1="905" y1="135" x2="1095" y2="135" stroke="#a855f7" stroke-width="6" filter="url(#blur)"/>

  <!-- brilho atrás do monitor -->
  <rect class="led" x="440" y="95" width="320" height="190" rx="20" fill="#9333ea" filter="url(#blurBig)"/>

  <!-- mesa -->
  <rect x="190" y="300" width="820" height="16" rx="3" fill="url(#desk)"/>
  <line x1="190" y1="300" x2="1010" y2="300" stroke="#c084fc" stroke-opacity=".5"/>
  <rect x="215" y="316" width="14" height="84" fill="#151021"/><rect x="971" y="316" width="14" height="84" fill="#151021"/>
  <line class="led" x1="200" y1="318" x2="1000" y2="318" stroke="#a855f7" stroke-width="10" filter="url(#blur)"/>
  <line x1="200" y1="317" x2="1000" y2="317" stroke="#d8b4fe" stroke-width="2"/>

  <!-- luminária -->
  <rect x="285" y="292" width="40" height="8" rx="3" fill="#2a2138"/>
  <path d="M305 292 L292 222 L330 205" stroke="#2a2138" stroke-width="5" fill="none"/>
  <path d="M318 196 l30 6 -6 16 -30 -6 z" fill="#3f2a56"/>
  <path class="led" d="M322 214 L300 298 L372 298 L346 220 z" fill="#e9d5ff" opacity=".18" filter="url(#blur)"/>

  <!-- caneca -->
  <rect x="385" y="276" width="22" height="24" rx="3" fill="#4c1d95"/>
  <path d="M407 282 q10 0 10 7 t-10 7" stroke="#4c1d95" stroke-width="3" fill="none"/>

  <!-- gabinete com fans -->
  <rect x="835" y="188" width="86" height="112" rx="5" fill="#120d1c" stroke="#3f2a56" stroke-width="2"/>
  <rect x="843" y="196" width="70" height="96" rx="3" fill="#1e1530"/>
  <rect class="led" x="843" y="196" width="70" height="96" rx="3" fill="#7e22ce" opacity=".35" filter="url(#blur)"/>
  <g>
    <circle cx="878" cy="222" r="17" fill="none" stroke="#c084fc" stroke-width="2"/>
    <g class="fan"><path d="M878 222 l0 -14 a5 5 0 0 1 5 6 z M878 222 l14 0 a5 5 0 0 1 -6 5 z M878 222 l0 14 a5 5 0 0 1 -5 -6 z M878 222 l-14 0 a5 5 0 0 1 6 -5 z" fill="#a855f7"/></g>
    <circle cx="878" cy="266" r="17" fill="none" stroke="#c084fc" stroke-width="2"/>
    <g class="fan"><path d="M878 266 l0 -14 a5 5 0 0 1 5 6 z M878 266 l14 0 a5 5 0 0 1 -6 5 z M878 266 l0 14 a5 5 0 0 1 -5 -6 z M878 266 l-14 0 a5 5 0 0 1 6 -5 z" fill="#a855f7"/></g>
  </g>

  <!-- monitor -->
  <rect x="590" y="268" width="20" height="26" fill="#1a1426"/>
  <ellipse cx="600" cy="297" rx="42" ry="5" fill="#1a1426"/>
  <rect x="460" y="105" width="280" height="163" rx="8" fill="#0d0a14" stroke="#2a2138" stroke-width="2"/>
  <g clip-path="url(#screenClip)">
    <rect x="470" y="113" width="260" height="147" fill="#0c0716"/>
    <!-- tela antes do zoom -->
    <g class="idle">
      <rect x="470" y="113" width="260" height="147" fill="url(#screenIdle)"/>
      <circle cx="600" cy="180" r="26" fill="none" stroke="#f5d0fe" stroke-width="2" opacity=".8"/>
      <text x="600" y="185" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">&lt;/&gt;</text>
      <text x="600" y="228" text-anchor="middle" font-size="9" fill="#f5d0fe">gustavo@dev</text>
    </g>
    <!-- terminal com as informações -->
    <g class="term">
      <rect x="470" y="113" width="260" height="147" fill="#0c0716"/>
      <rect x="470" y="113" width="260" height="10" fill="#1e1530"/>
      <circle cx="477" cy="118" r="2" fill="#f87171"/><circle cx="484" cy="118" r="2" fill="#facc15"/><circle cx="491" cy="118" r="2" fill="#4ade80"/>
    </g>
    <text class="l0" x="480" y="131" font-size="9" fill="#c084fc" font-weight="normal">gustavo@dev:~$ ./perfil</text><text class="l1" x="480" y="149" font-size="12" fill="#ffffff" font-weight="bold">Gustavo Jesus Palmentieri</text><text class="l2" x="480" y="167" font-size="9" fill="#e9d5ff" font-weight="normal">Estudante de ADS · desde 2025</text><text class="l3" x="480" y="181" font-size="9" fill="#e9d5ff" font-weight="normal">C · C++ · Python · SQL</text><text class="l4" x="480" y="195" font-size="9" fill="#e9d5ff" font-weight="normal">Foco: Programação &amp; Dados</text><text class="l5" x="480" y="209" font-size="9" fill="#e9d5ff" font-weight="normal">Santo André - SP</text><text class="l6" x="480" y="227" font-size="9" fill="#a78bfa" font-weight="normal">status: aberto a oportunidades</text>
    <rect class="l6 cursor" x="648" y="219" width="5" height="10" fill="#c084fc"/>
  </g>

  <!-- teclado e mouse -->
  <rect x="515" y="287" width="170" height="11" rx="3" fill="#1a1426"/>
  <rect class="led" x="515" y="287" width="170" height="11" rx="3" fill="url(#kb)" opacity=".55"/>
  <rect class="led" x="515" y="290" width="170" height="6" fill="#a855f7" filter="url(#blur)"/>
  <ellipse cx="722" cy="293" rx="9" ry="6" fill="#1a1426" stroke="#a855f7" stroke-width="1"/>
</g>
<rect width="1200" height="400" fill="url(#vignette)" pointer-events="none"/>
</svg>